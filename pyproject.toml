[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyloai"
version = "0.4.1"
description = "An AI-native modular phylogenomics analysis platform"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.1",
    "mcp>=1.0",
    "rich>=13.0",
    "biopython>=1.81",
    "clipkit>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1",
]

[project.scripts]
phyloai = "phyloai.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["phyloai"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"demo_data" = "demo_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
